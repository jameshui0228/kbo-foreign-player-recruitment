name: Public result verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/portfolio_demo.py --check
      - run: python -m unittest discover -s tests -v
